baseURL = 'https://go-crucible.invalid/'
locale = 'en-US'
title = 'Computer Science Through Production Systems'
publishDir = 'public'
relativeURLs = true
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', 'robotsTXT', '404']

[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'
  [module.hugoVersion]
    extended = true
    min = '0.164.0'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = true
    style = 'base16-snazzy'
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = 'light'
  BookToC = true
  BookSection = '/'
  BookSearch = true
  BookComments = false
